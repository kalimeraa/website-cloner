<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">Website Cloner — capture the web, keep the files</title>
  <desc id="desc">An open-source desktop website archiver powered by CloakBrowser, with local HTTP previews and editable files.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#111a37"/><stop offset="1" stop-color="#303f81"/></linearGradient>
    <linearGradient id="accent" x2="1" y2="1"><stop stop-color="#7789ff"/><stop offset="1" stop-color="#4b5ce8"/></linearGradient>
  </defs>
