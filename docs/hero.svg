  <circle cx="1150" cy="80" r="240" fill="#8291ff" opacity=".06"/>
  <circle cx="1190" cy="50" r="150" fill="none" stroke="#a3afff" stroke-opacity=".12"/>
  <rect x="64" y="54" width="64" height="64" rx="16" fill="url(#accent)"/>
