    <text x="147" y="109" fill="#b6c1e9" font-size="14" letter-spacing="2">OPEN SOURCE · LOCAL FIRST</text>
    <text x="64" y="205" fill="white" font-size="58" font-weight="750" letter-spacing="-2">Capture the web.</text>
    <text x="64" y="270" fill="#aebaff" font-size="58" font-weight="750" letter-spacing="-2">Keep the files.</text>
    <text x="66" y="316" fill="#d4dcf7" font-size="20">A desktop website archiver powered by CloakBrowser.</text>
    <g fill="#1d2a54" stroke="#536394" stroke-opacity=".6">
